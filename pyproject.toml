[project]
name = "grpo-from-scratch"
version = "0.1.0"
description = "GRPO/RLVR from scratch: train a small LM to emit strict-JSON todos, on a Pascal GPU"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "pyarrow",
]

[project.optional-dependencies]
tier-a = [
    "torch==2.14.0",
    "transformers==5.17.0",
    "trl==1.13.0",
    "peft==0.20.0",
    "datasets==5.0.1",
    "accelerate",
    "pyarrow",
    "matplotlib",
]
cosine = [
    "sentence-transformers==6.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["train", "data", "scripts"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
